name: CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'

jobs:
  quality:
    name: Lint + Typecheck + Build + Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servium
          POSTGRES_PASSWORD: servium
          POSTGRES_DB: servium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://servium:servium@localhost:5432/servium
      MAILPIT_SMTP_HOST: localhost
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_API_URL: http://localhost:8025
      SERVIUM_SERVICE_ID: "11111111-2222-3333-4444-555555555555"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (gera dist de shared-types p/ resolução de tipos)
        run: npm run build

      - name: Typecheck (web — build via esbuild não verifica tipos)
        run: npm run typecheck

      - name: Testes
        run: npm run test
